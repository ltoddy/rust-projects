[package]
name = "tokio-jsonl"
version = "0.1.2"
edition = "2024"
description = "Buffered, append-oriented JSON Lines (jsonl) reading and writing for tokio, made by Aries"
readme = "README.md"
homepage = "https://github.com/ltoddy/rust-projects/tree/main/crates/tokio-jsonl"
repository = "https://github.com/ltoddy/rust-projects"
license = "MIT"
authors = ["liutao.rs <taoliu0509@gmail.com>"]
keywords = ["jsonl", "json-lines", "tokio", "async", "logging"]
categories = ["asynchronous", "encoding", "filesystem"]

[features]
default = ["fs", "background"]
fs = ["tokio/fs"]
background = ["fs", "tokio/rt", "tokio/macros", "tokio/sync", "tokio/time"]

[dependencies]
bytes = "1"
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util"] }
tokio-stream = { version = "0.1", default-features = false }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }

[dev-dependencies]
divan = "0.1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "fs", "sync", "time"] }

[[bench]]
name = "throughput"
harness = false
required-features = ["fs", "background"]

[[test]]
name = "jsonl"
required-features = ["fs", "background"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "deny"

[lints.clippy]
unwrap_used = "warn"
