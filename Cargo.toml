[package]
name = "cloc"
version = "0.1.5"
authors = ["ltoddy <taoliu0509@gmail.com>"]
edition = "2024"
license = "MIT"
readme = "README.md"
keywords = ["cloc", "tokei", "lines-of-code", "statistics", "cli"]
categories = ["command-line-utilities", "development-tools"]
description = "统计目录下各语言的代码行、注释行与空行，类似 cloc"
repository = "https://github.com/ltoddy/cloc-rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
ignore = "0.4"
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
mimalloc = "0.1.52"
thiserror = "2.0"

[lints.clippy]
all = "warn"
