[package]
name = "rcloc"
version = "0.7.0"
authors = ["ltoddy <taoliu0509@gmail.com>"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
keywords = ["cloc", "rcloc"]
categories = ["command-line-utilities", "development-tools"]
description = "Count, or compute differences of, lines of source code and comments."
repository = "https://github.com/ltoddy/cloc-rs"

include = [
    "src/**/*.rs",
    "Cargo.toml",
    "LICENSE",
    "README.md"
]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
mimalloc = "0.1.52"

[lints.clippy]
all = "warn"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true

