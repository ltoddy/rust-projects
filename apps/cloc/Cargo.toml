[package]
name = "cloc"
version = "0.1.8"
edition = "2024"
description = "统计目录下各语言的代码行、注释行与空行，类似 cloc"
readme = "README.md"
homepage = "https://github.com/ltoddy/rust-projects/tree/main/apps/cloc"
repository = "https://github.com/ltoddy/rust-projects"
license = "MIT"
authors = ["ltoddy <taoliu0509@gmail.com>"]
keywords = ["cloc", "tokei", "lines-of-code", "statistics", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
ignore = "0.4"
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
mimalloc = "0.1.52"
thiserror = "2.0"
